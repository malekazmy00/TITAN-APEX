name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    # byparr is only needed by tests/integration/test_byparr_live_solve.py.
    # GitHub Actions runners have real, unrestricted outbound internet
    # (unlike a sandboxed local dev environment), so this is where the two
    # "Pending Real-Network Verification" items in docs/REQUIREMENTS.md
    # actually get proven for real.
    services:
      byparr:
        image: ghcr.io/thephaseless/byparr:latest
        ports:
          - 8191:8191
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      TITAN_BYPARR_URL: http://localhost:8191
      TITAN_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      # docs/REQUIREMENTS.md section 9's "DOM Virtualization Instability"
      # investigation's monitoring-infrastructure investment: started as
      # early as possible (right after checkout) so it covers the whole
      # job, not just the "Integration tests" step -- a real, explicit
      # user request after two CI attempts of a code-only fix left the
      # actual root cause unconfirmed. scripts/ci-monitor-start.sh's own
      # header comment has the full reasoning.
      - name: Start resource monitors (docker stats + runner stats, for the whole job)
        run: scripts/ci-monitor-start.sh "$GITHUB_WORKSPACE/ci-diagnostics"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,testenv]"
      - run: playwright install --with-deps chromium
      - name: Fetch Camoufox browser binary
        # CamoufoxProvider (docs/REQUIREMENTS.md section 9 entry 4 / round 3)
        # drives its own real browser -- needs the actual binary, same
        # reason as playwright install above.
        run: python -m camoufox fetch
      - name: Install Patchright browser binary
        # PatchrightProvider (this phase's revision) is a drop-in
        # Playwright replacement but needs its OWN separate patched
        # Chromium -- it does not reuse the plain `playwright install`
        # binary above, confirmed against Patchright's own README.
        run: patchright install chromium
      - name: Unit tests (coverage gate >= 85%)
        run: pytest tests/unit -v --cov=src --cov-fail-under=85
      - name: Contract tests
        run: pytest tests/contract -v
      - name: test-environment unit tests (coverage gate >= 85%)
        # test-environment/mock-target's own Flask app + challenge layers --
        # separate from src/'s own coverage gate above (it's test
        # infrastructure, not part of the product). See
        # test-environment/README.md.
        run: |
          cd test-environment
          pytest tests/ -v --cov=mock-target --cov-fail-under=85
      - name: test-environment stack (build + up)
        # docker-compose.test.yml's mock-target image is built locally
        # (docker-compose.test.yml comment) -- GitHub Actions `services:`
        # can only pull pre-built registry images, it cannot `build:` from
        # a local Dockerfile, so this stack runs as a plain compose step
        # instead, the same way Byparr/Redis above run as real `services:`
        # (they're both pre-built registry images). `--wait` blocks until
        # every service's own healthcheck (docker-compose.test.yml) passes,
        # so this step itself is the "is it actually up" proof, not an
        # assumption.
        run: docker compose -f test-environment/docker-compose.test.yml up -d --build --wait
      - name: Integration tests (live network -- Playwright render, Byparr solve, Camoufox solve, Patchright solve, Test Targets, mock-target)
        # Bumped from 6 -> 12 when the Test Targets configs/tests were added
        # (docs/TEST_TARGETS.md): more live sites, several of them
        # render_js (a fresh headless-browser launch per page), plus
        # test_hackernews_live.py's deliberate 45s gap between its two
        # live runs. Bumped again for test_mock_target_live.py (docs/REQUIREMENTS.md
        # section 8's Escalation Cycle, section 9's "Known Gaps from Test
        # Environment"), again for test_mock_target_camoufox_live.py
        # (section 9 entry 4 / round 3 -- a second real browser launch,
        # plus CamoufoxProvider's own post_load_wait_ms), again for
        # test_mock_target_patchright_live.py (this phase's revision -- a
        # third real browser launch, plus its own post_load_wait_ms), and
        # again for test_mock_target_camoufox_live.py's cookie-wall
        # click-through + test_mock_target_feed_live.py (JSON/API round,
        # docs/OBSTACLE_MAP_AND_ESCALATION_SCHEDULE.md -- a fourth real
        # browser launch against /api/feed).
        timeout-minutes: 20
        env:
          # docs/REQUIREMENTS.md section 9's "DOM Virtualization
          # Instability" investigation's monitoring-infrastructure
          # investment: off by default everywhere else (src/providers/
          # antibot/_tracing.py's own module docstring) -- active here so
          # every live browser-driving call in this step captures a real
          # Playwright trace (screenshots, DOM snapshots, network,
          # console, source-mapped stack traces), uploaded below.
          TITAN_TRACE_DIR: ${{ github.workspace }}/ci-diagnostics/traces
          # docs/REQUIREMENTS.md section 9 entry 17's "expand the
          # diagnostic tool" phase: off everywhere else (same
          # off-by-default principle as TITAN_TRACE_DIR above) -- active
          # here so this specific investigation gets its
          # enter/blocked/fetch_start/fetch_done/reset_loading timeline
          # (camoufox_provider.py's own data-load-event-log read,
          # _tracing.py's module docstring) from a *real* CI run, not
          # just local reproductions -- this project's own "no assume
          # environment constraint" rule applies here exactly as
          # everywhere else. TITAN_DEBUG_LOADING_RACE also gates the
          # other entry-17 diagnostics already wired into
          # camoufox_provider.py (loading_flag_at_network_idle,
          # main_frame_navigations_during_progressive,
          # load_more_calls_samples) -- all of them start reporting real
          # data in this step's own console output the moment this is
          # set, no separate toggle needed.
          TITAN_DEBUG_LOADING_RACE: "1"
          TITAN_LOAD_EVENT_LOG_DIR: ${{ github.workspace }}/ci-diagnostics/load-events
        run: |
          mkdir -p "$TITAN_TRACE_DIR" "$TITAN_LOAD_EVENT_LOG_DIR"
          if [ -n "$(find tests/integration -name 'test_*.py' -print -quit)" ]; then
            # docs/REQUIREMENTS.md section 9's "DOM Virtualization
            # Instability" investigation -- baseline-data attempt, take 2.
            # --log-cli-level=INFO (added for run 33027674104) turned out
            # not to fix the actual gap: every live test's structured
            # solve logs are emitted inside a separate `scrapy runspider`
            # *subprocess* (tests/integration/_live_helpers.py), captured
            # via `subprocess.run(capture_output=True)` and only reach
            # this console through that helper's own unconditional
            # `print(...)` of the subprocess's stderr tail -- and pytest
            # itself only *displays* a test's captured stdout for a
            # *failing* test by default. That display rule is completely
            # unrelated to `--log-cli-level` (which only governs logging
            # emitted inside the pytest process itself, never a child
            # subprocess's own output) -- confirmed for real: run
            # 33029625940 ran with --log-cli-level=INFO active and still
            # showed structured solve logs for its 2 *failing* tests only,
            # zero for any of the other 35 (passing) tests, including
            # several other Camoufox-driven ones in the very same run.
            # `-s` (== `--capture=no`) is the real fix -- it turns off
            # pytest's output capturing entirely, so that unconditional
            # print() reaches this console for every test, pass or fail.
            pytest tests/integration -v --log-cli-level=INFO -s
          else
            echo "No integration tests yet (added from Phase 2 onward)."
          fi
      - name: Stop resource monitors
        if: always()
        run: scripts/ci-monitor-stop.sh "$GITHUB_WORKSPACE/ci-diagnostics"
      - name: Check for kernel OOM activity
        # Confirms or denies the "memory pressure" hypothesis with direct
        # evidence, every run -- not just when something already failed
        # (docs/REQUIREMENTS.md section 9's "DOM Virtualization
        # Instability" investigation's monitoring-infrastructure
        # investment). scripts/ci-check-oom.sh's own header comment has
        # the full reasoning.
        if: always()
        run: scripts/ci-check-oom.sh "$GITHUB_WORKSPACE/ci-diagnostics/oom-check.txt"
      - name: Upload CI diagnostics (docker/runner resource logs, OOM check, Playwright traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-diagnostics/
          # Diagnostic evidence, not a build artifact anyone needs
          # forever -- short retention keeps this from silently
          # accumulating storage across every push/PR run.
          retention-days: 14
          if-no-files-found: warn
      - name: test-environment stack logs
        # Unlike byparr/redis above, this stack isn't a `services:` entry,
        # so its containers' logs aren't printed automatically on job
        # cleanup -- anubis's own log is the only place that shows *why*
        # a request it handled failed (its own request log, distinct from
        # anything the client/provider side can observe), so print it for
        # real before the containers are torn down.
        if: always()
        run: docker compose -f test-environment/docker-compose.test.yml logs anubis mock-target
      - name: test-environment stack teardown
        if: always()
        run: docker compose -f test-environment/docker-compose.test.yml down -v
