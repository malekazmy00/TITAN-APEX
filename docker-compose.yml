# Phase 4 (Redis) is still a placeholder — added when that phase lands.
services:
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    ports:
      - "8191:8191"
    restart: unless-stopped
    # Point TITAN_BYPARR_URL at http://byparr:8191 (from other containers)
    # or http://localhost:8191 (from the host) — never hardcode this in
    # code, it's read from the environment (see .env.example).
