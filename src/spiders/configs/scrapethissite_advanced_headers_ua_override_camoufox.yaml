# The real, live proof of user_agent_override (docs/REQUIREMENTS.md
# section 9 entry 24/27) against the exact target that
# first surfaced the gap: scrapethissite.com/pages/advanced/?gotcha=headers
# rejects any User-Agent that doesn't "look like a standard mozilla/
# chrome/safari value" -- the original round's fix (render_js: true,
# scrapethissite_advanced_headers.yaml) worked around the gap by relying
# on PlaywrightMiddleware's real Chromium sending a real browser UA
# automatically. This config instead drives the same URL through
# CamoufoxProvider (antibot_needed: true, not render_js) with
# user_agent_override set to a real, browser-shaped User-Agent string
# that is NOT Camoufox's own default (a real Firefox desktop UA) --
# a mobile Safari string, confirmed by hand (curl) to independently pass
# this exact site's own "looks like a browser" check.
#
# What this proves: the override reaches the real browser context (a
# request with this exact override still gets "Headers properly spoofed"
# from the site). What this alone does NOT prove (documented honestly,
# not overclaimed): the site has no way to echo the exact UA string back,
# so a coincidental pass using Camoufox's own real default UA would look
# identical from the outside -- the unit tests
# (test_camoufox_provider.py's test_user_agent_override_reaches_the_solve_function)
# are what prove the exact string reaches browser.new_context(user_agent=...)
# verbatim; this live test proves that mechanism actually works end to
# end against a genuine external target, not just against a fake solve_fn.
name: scrapethissite_advanced_headers_ua_override_camoufox
start_urls:
  - "https://www.scrapethissite.com/pages/advanced/?gotcha=headers"
allowed_domains:
  - "www.scrapethissite.com"
rate_limit: 1.0
antibot_needed: true
antibot_provider: camoufox
user_agent_override: "Mozilla/5.0 (iPhone; CPU iPhone OS 17_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.4 Mobile/15E148 Safari/604.1"
selectors:
  item: "div.col-md-4.col-md-offset-4"
  fields:
    message: "::text"
