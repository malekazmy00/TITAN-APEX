<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mock Target - Feed</title>
</head>
<body>
  <main>
    <h1 class="page-title">Live Feed</h1>
    <div data-role="feed"></div>
    <div id="loading" style="display:none">Loading...</div>
  </main>

  <script>
    // Real lazy loading: nothing beyond the first batch exists in the DOM
    // until the page is actually scrolled near the bottom -- same shape
    // as quotes.toscrape.com/scroll, which PlaywrightMiddleware's
    // scroll-to-bottom loop already proved it can drive.
    (function () {
      let cursor = null;
      let hasNext = true;
      let loading = false;
      const container = document.querySelector('[data-role="feed"]');
      const loadingEl = document.getElementById("loading");
      // DOM Virtualization (docs/OBSTACLE_MAP_AND_ESCALATION_SCHEDULE.md's
      // محور 3, docs/REQUIREMENTS.md section 9 entry 13): mirrors
      // structural/dom_virtualization.py's excess_count(rendered_count,
      // window_size) by hand -- that module is this rule's real,
      // unit-tested source of truth; this is the client-side rendering
      // of it, same shape structural/ab_variant.py's container_tag_for
      // already has for its own server-side decision.
      const virtualizationEnabled = {{ dom_virtualization_enabled | tojson }};
      const windowSize = {{ dom_virtualization_window_size }};

      function renderComments(comments, parent) {
        comments.forEach(function (comment) {
          const el = document.createElement("div");
          el.setAttribute("data-role", "comment");
          el.setAttribute("data-comment-id", comment.id);
          const author = document.createElement("span");
          author.setAttribute("data-role", "comment-author");
          author.textContent = comment.author;
          const text = document.createElement("span");
          text.setAttribute("data-role", "comment-text");
          text.textContent = comment.text;
          el.appendChild(author);
          el.appendChild(text);
          parent.appendChild(el);
          if (comment.replies && comment.replies.length) {
            renderComments(comment.replies, parent);
          }
        });
      }

      function appendEdges(edges) {
        edges.forEach(function (edge) {
          const post = edge.post;
          const article = document.createElement("article");
          article.setAttribute("data-role", "post");
          article.setAttribute("data-post-id", post.id);

          const author = document.createElement("span");
          author.setAttribute("data-role", "post-author");
          author.textContent = post.author;

          const text = document.createElement("p");
          text.setAttribute("data-role", "post-text");
          text.textContent = post.text;

          const likes = document.createElement("span");
          likes.setAttribute("data-role", "post-likes");
          likes.textContent = post.likes;

          const commentsDiv = document.createElement("div");
          commentsDiv.setAttribute("data-role", "comments");
          renderComments(edge.comments, commentsDiv);

          article.appendChild(author);
          article.appendChild(text);
          article.appendChild(likes);
          article.appendChild(commentsDiv);
          container.appendChild(article);
        });

        if (virtualizationEnabled) {
          // Evict the *oldest* rendered posts once over the window --
          // genuinely removed from the DOM (removeChild), not hidden.
          // A raw HTML/live-DOM read after this point will never see
          // them again; see structural/dom_virtualization.py's own
          // docstring for why that's a fundamentally different problem
          // from every other structural challenge here.
          let excess = container.children.length - windowSize;
          while (excess > 0) {
            container.removeChild(container.firstElementChild);
            excess -= 1;
          }
        }
      }

      // docs/REQUIREMENTS.md section 9 entry 17's monitoring-infrastructure
      // investment: a real, cheap, page-side counter distinguishing "a
      // scroll-triggered loadMore() call actually ran" from "it was
      // silently dropped because the previous fetch was still in
      // flight" -- the two things a Playwright-side network-idle check
      // structurally cannot tell apart (confirmed for real, CI run
      // 32997246624: network_idle_timeouts was 0 the whole run -- the
      // network side was never the bottleneck -- yet the same
      // shortfall happened anyway). Deliberately does *not* count a
      // no-op caused by `!hasNext` (pagination genuinely finished) as a
      // "drop" -- that is normal, expected behavior, not a race.
      // camoufox_provider.py/patchright_provider.py read these back via
      // page.evaluate() when progressive_extraction is used, and log
      // them -- harmless (stays undefined, read back as 0) on any page
      // that isn't this one.
      window.__loadMoreCalls = 0;
      window.__loadMoreDropped = 0;
      // TEMPORARY DIAGNOSTIC (docs/REQUIREMENTS.md section 9 entry 17,
      // unconfirmed hypothesis review before any third fix attempt):
      // mirrors the `loading` closure variable onto `window` so an
      // outside page.evaluate() can read its *current* value at an
      // arbitrary instant (e.g. right when a Playwright-side
      // network-idle check says "settled"). Purely additive, read-only
      // from the outside, same synchronous assignment cost as the
      // existing `loading = ...` lines it sits next to -- zero timing
      // impact on loadMore() itself. Not a fix; remove once entry 17's
      // real root cause is confirmed either way.
      window.__loadingFlagDebug = false;

      function loadMore() {
        if (loading || !hasNext) {
          if (loading) {
            window.__loadMoreDropped += 1;
          }
          return;
        }
        window.__loadMoreCalls += 1;
        loading = true;
        window.__loadingFlagDebug = true;
        loadingEl.style.display = "block";
        const url = cursor ? "/api/feed?after=" + encodeURIComponent(cursor) : "/api/feed";
        fetch(url)
          .then(function (response) {
            return response.json();
          })
          .then(function (data) {
            appendEdges(data.edges || []);
            const pageInfo = data.page_info || {};
            cursor = pageInfo.end_cursor;
            hasNext = Boolean(pageInfo.has_next_page);
            loading = false;
            window.__loadingFlagDebug = false;
            loadingEl.style.display = "none";
          })
          .catch(function () {
            loading = false;
            window.__loadingFlagDebug = false;
            loadingEl.style.display = "none";
          });
      }

      window.addEventListener("scroll", function () {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
          loadMore();
        }
      });

      loadMore();
    })();
  </script>
</body>
</html>
