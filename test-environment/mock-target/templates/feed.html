<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mock Target - Feed</title>
</head>
<body>
  <main>
    <h1 class="page-title">Live Feed</h1>
    <div data-role="feed"></div>
    <div id="loading" style="display:none">Loading...</div>
  </main>

  <script>
    // Real lazy loading: nothing beyond the first batch exists in the DOM
    // until the page is actually scrolled near the bottom -- same shape
    // as quotes.toscrape.com/scroll, which PlaywrightMiddleware's
    // scroll-to-bottom loop already proved it can drive.
    (function () {
      let cursor = null;
      let hasNext = true;
      let loading = false;
      const container = document.querySelector('[data-role="feed"]');
      const loadingEl = document.getElementById("loading");
      // DOM Virtualization (docs/OBSTACLE_MAP_AND_ESCALATION_SCHEDULE.md's
      // محور 3, docs/REQUIREMENTS.md section 9 entry 13): mirrors
      // structural/dom_virtualization.py's excess_count(rendered_count,
      // window_size) by hand -- that module is this rule's real,
      // unit-tested source of truth; this is the client-side rendering
      // of it, same shape structural/ab_variant.py's container_tag_for
      // already has for its own server-side decision.
      const virtualizationEnabled = {{ dom_virtualization_enabled | tojson }};
      const windowSize = {{ dom_virtualization_window_size }};

      function renderComments(comments, parent) {
        comments.forEach(function (comment) {
          const el = document.createElement("div");
          el.setAttribute("data-role", "comment");
          el.setAttribute("data-comment-id", comment.id);
          const author = document.createElement("span");
          author.setAttribute("data-role", "comment-author");
          author.textContent = comment.author;
          const text = document.createElement("span");
          text.setAttribute("data-role", "comment-text");
          text.textContent = comment.text;
          el.appendChild(author);
          el.appendChild(text);
          parent.appendChild(el);
          if (comment.replies && comment.replies.length) {
            renderComments(comment.replies, parent);
          }
        });
      }

      function appendEdges(edges) {
        edges.forEach(function (edge) {
          const post = edge.post;
          const article = document.createElement("article");
          article.setAttribute("data-role", "post");
          article.setAttribute("data-post-id", post.id);

          const author = document.createElement("span");
          author.setAttribute("data-role", "post-author");
          author.textContent = post.author;

          const text = document.createElement("p");
          text.setAttribute("data-role", "post-text");
          text.textContent = post.text;

          const likes = document.createElement("span");
          likes.setAttribute("data-role", "post-likes");
          likes.textContent = post.likes;

          const commentsDiv = document.createElement("div");
          commentsDiv.setAttribute("data-role", "comments");
          renderComments(edge.comments, commentsDiv);

          article.appendChild(author);
          article.appendChild(text);
          article.appendChild(likes);
          article.appendChild(commentsDiv);
          container.appendChild(article);
        });

        if (virtualizationEnabled) {
          // Evict the *oldest* rendered posts once over the window --
          // genuinely removed from the DOM (removeChild), not hidden.
          // A raw HTML/live-DOM read after this point will never see
          // them again; see structural/dom_virtualization.py's own
          // docstring for why that's a fundamentally different problem
          // from every other structural challenge here.
          let excess = container.children.length - windowSize;
          while (excess > 0) {
            container.removeChild(container.firstElementChild);
            excess -= 1;
          }
        }
      }

      // docs/REQUIREMENTS.md section 9 entry 17's monitoring-infrastructure
      // investment: a real, cheap, page-side counter distinguishing "a
      // scroll-triggered loadMore() call actually ran" from "it was
      // silently dropped because the previous fetch was still in
      // flight" -- the two things a Playwright-side network-idle check
      // structurally cannot tell apart (confirmed for real, CI run
      // 32997246624: network_idle_timeouts was 0 the whole run -- the
      // network side was never the bottleneck -- yet the same
      // shortfall happened anyway). Deliberately does *not* count a
      // no-op caused by `!hasNext` (pagination genuinely finished) as a
      // "drop" -- that is normal, expected behavior, not a race.
      //
      // **Revision, same entry 17 (a real, CI-confirmed bug in this
      // diagnostic itself, not in loadMore()):** these were originally
      // plain `window.__loadMoreCalls`/`__loadMoreDropped` expando
      // properties, read back via `page.evaluate("window.__loadMoreCalls
      // || 0")`. Confirmed by hand with three separate control cases
      // (a fresh `about:blank` page, a synthetic `page.set_content()`
      // page, and this exact live page) that Camoufox/Firefox's
      // automation protocol cannot see a plain `window.*` property once
      // it's set by the *page's own* inline `<script>` execution --
      // `page.evaluate()` reads it back as `undefined` every time
      // (silently coerced to a misleadingly plausible-looking `0` by the
      // old `|| 0` fallback), even though `loadMore()` itself was
      // running and appending real content the whole time. The same
      // three controls confirmed a DOM *attribute* set by that same
      // inline script, or `document.title`, reads back correctly --
      // this is specifically a `window` expando-property isolation
      // (almost certainly Firefox's Xray-vision wrapper separating the
      // page's own script realm from the automation-privileged one
      // `evaluate()` runs in), not a DOM-content isolation. Mirrored
      // onto `container` (`[data-role="feed"]`, already queried above,
      // never itself evicted by DOM Virtualization) as plain string
      // attributes instead -- camoufox_provider.py/patchright_provider.py
      // now read these, not a `window.*` property. Harmless (`?.`
      // short-circuits to `undefined`, `Number(undefined) || 0` is `0`)
      // on any page that isn't this one, same fallback shape as before.
      container.setAttribute("data-load-more-calls", "0");
      container.setAttribute("data-load-more-dropped", "0");
      // Same revision: mirrors the `loading` closure variable as a DOM
      // attribute so an outside page.evaluate() can read its *current*
      // value at an arbitrary instant (e.g. right when a Playwright-side
      // network-idle check says "settled") -- see this block's own
      // comment above for why a DOM attribute, not a `window.*`
      // property, is the one that actually survives the read.
      container.setAttribute("data-loading-flag", "false");

      // TEMPORARY DIAGNOSTIC (docs/REQUIREMENTS.md section 9 entry 17,
      // "expand the diagnostic tool" phase -- requested after the
      // network-idle-vs-loading-flag hypothesis was falsified and the
      // separate load_more_calls=0 mystery was closed, both by real
      // evidence, not guessing).
      //
      // **First attempt (real, confirmed not to work, not erased):**
      // `page.expose_function()`, called on `camoufox_provider.py`'s
      // side before navigation -- Playwright's own documented mechanism
      // for letting page-authored JS call back into the controlling
      // process. Confirmed by hand (two separate control cases: a
      // synthetic `page.set_content()` page, and a real `page.goto()`
      // navigation) that the exposed function *is* visible from
      // `page.evaluate()` (`typeof window.__titanLogLoadEvent ===
      // "function"`) but reads back as `undefined` from *inside the
      // page's own inline `<script>`* -- the exact mirror image of the
      // `window.__loadMoreCalls` bug above, just in the opposite
      // crossing direction. Same Xray-vision family of realm
      // separation, apparently cutting both ways on this Camoufox
      // build.
      //
      // **Corrected approach (this version):** since a DOM attribute
      // set by the page's own script *does* survive a `page.evaluate()`
      // read (confirmed above, and re-confirmed with a JSON-string
      // payload specifically before writing this), the timeline is
      // accumulated in a plain in-page array and mirrored as one
      // `JSON.stringify`-ed DOM attribute on every event -- no
      // cross-realm function call needed at all.
      // `camoufox_provider.py` reads and parses it *once*, after
      // progressive collection finishes, via the same `_read_feed_attr`
      // used for `data-load-more-calls`/`data-loading-flag`. No
      // synchronous I/O and no cross-process call here -- `loadEventLog`
      // is a local array, `JSON.stringify` of a handful of tiny objects
      // is microseconds, nowhere near an observable delay to
      // `loadMore()` itself.
      const loadEventLog = [];
      function logLoadEvent(name) {
        loadEventLog.push({ event: name, t: performance.now() });
        container.setAttribute("data-load-event-log", JSON.stringify(loadEventLog));
      }

      function loadMore() {
        logLoadEvent("enter");
        if (loading || !hasNext) {
          if (loading) {
            container.setAttribute(
              "data-load-more-dropped",
              String(Number(container.getAttribute("data-load-more-dropped")) + 1)
            );
            logLoadEvent("blocked");
          }
          return;
        }
        container.setAttribute(
          "data-load-more-calls",
          String(Number(container.getAttribute("data-load-more-calls")) + 1)
        );
        loading = true;
        container.setAttribute("data-loading-flag", "true");
        loadingEl.style.display = "block";
        logLoadEvent("fetch_start");
        const url = cursor ? "/api/feed?after=" + encodeURIComponent(cursor) : "/api/feed";
        fetch(url)
          .then(function (response) {
            return response.json();
          })
          .then(function (data) {
            logLoadEvent("fetch_done");
            appendEdges(data.edges || []);
            const pageInfo = data.page_info || {};
            cursor = pageInfo.end_cursor;
            hasNext = Boolean(pageInfo.has_next_page);
            loading = false;
            container.setAttribute("data-loading-flag", "false");
            logLoadEvent("reset_loading");
            loadingEl.style.display = "none";
          })
          .catch(function () {
            loading = false;
            container.setAttribute("data-loading-flag", "false");
            logLoadEvent("reset_loading_error");
            loadingEl.style.display = "none";
          });
      }

      window.addEventListener("scroll", function () {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
          loadMore();
        }
      });

      loadMore();
    })();
  </script>
</body>
</html>
