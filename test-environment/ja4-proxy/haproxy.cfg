# JA4/TLS fingerprinting proxy -- docs/REQUIREMENTS.md section 9 entry 17
# (F5-class multi-signal layer, claude/ja4-experiment branch).
#
# Deliberately a NEW, isolated front door -- Anubis's own existing
# `:8080` listener (docker-compose.test.yml) is completely untouched.
# This proxy terminates real TLS on its own port, computes a real JA4
# fingerprint from the ClientHello via FriendlyCaptcha's ja4.lua
# (vendored verbatim, MPL-2.0, https://github.com/FriendlyCaptcha/ja4-haproxy),
# forwards the fingerprint as a header, then hands the decrypted
# request to Anubis -- which still runs its own, separate real
# proof-of-work challenge on top. Two real, staged signals, not one
# replacing the other.

global
    # Without this, there's no ClientHello data for ja4.lua to read at
    # all (its own README: "Set the buffer too low and JA4 can be
    # wrong"). 336 bytes is FriendlyCaptcha's own documented
    # recommendation -- enough for any real-world client's cipher
    # suite/extension list, based on their own measured Chrome/curl
    # ClientHello sizes.
    tune.ssl.capture-buffer-size 336
    tune.lua.bool-sample-conversion normal
    lua-load-per-thread /usr/local/etc/haproxy/ja4.lua

defaults
    mode http
    timeout connect 10s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s

frontend ja4_frontend
    # Self-signed cert, generated fresh at image build time (Dockerfile) --
    # never committed to the repo. Real TLS, not a simulation: JA4
    # needs a genuine ClientHello to fingerprint at all.
    bind *:8443 ssl crt /usr/local/etc/haproxy/certs/combined.pem

    # Computes the real JA4 fingerprint from this connection's own
    # ClientHello (ja4.lua's own logic, unmodified).
    http-request lua.ja4

    # Forwarded as a header, not enforced here -- this proxy's own job
    # is fingerprinting, not blocking. A later step adds a log-only
    # consumer on the mock-target side (same "observe, don't enforce
    # alone" pattern BotD/fpscanner already use) -- this header exists
    # on every request through this proxy starting now, whether or not
    # anything reads it yet.
    http-request set-header X-JA4-Fingerprint %[var(txn.ja4)]

    default_backend anubis_backend

backend anubis_backend
    # Reaches Anubis's own container by its compose service name, over
    # the `edge` network both containers share -- Anubis itself is
    # completely unmodified, still runs its own real PoW challenge on
    # whatever this proxy forwards.
    server anubis anubis:8080
