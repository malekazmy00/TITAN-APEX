# Separate from the root docker-compose.yml (byparr/redis, the product's
# own runtime deps) -- this is the adversarial test environment itself.
# See README.md for what each service is, how to verify it's actually
# active, and how to add a new challenge layer.
#
# This file also runs its own dedicated `byparr` instance (see that
# service below) -- distinct from the root docker-compose.yml's, which
# stays a GitHub Actions `services:` container for every other live test.
# The two Byparr instances never conflict: this one only ever gets asked
# to fetch this stack's own URLs, on its own port
# (${MOCK_TARGET_BYPARR_PORT:-8193}), by tests/integration/test_mock_target_live.py
# specifically. See that service's comment for why it needs to be a
# separate instance at all, not just the existing one.
#
# Isolation (docs/REQUIREMENTS.md section 4/8): two networks, not one.
# `test-environment` is `internal: true` -- Docker gives it no default
# route out to the public internet at all, and (confirmed by hand: a
# plain `internal: true` network with a published port is unreachable
# from the host too, not just outbound-blocked -- Docker never wires up
# the NAT rule for it) it is *not* reachable from the host either.
# `mock-target` -- the thing actually serving fake data, honeypots, and
# decoy data -- has *only* this network: no route out, no route in
# except through anubis. `edge` is a normal (non-internal) bridge network
# that exists solely so anubis's port can be published to the host --
# the same shape a real reverse proxy has (one leg on the protected
# backend network, one leg facing the world). This does give anubis
# itself normal outbound access, same as any real edge proxy; mock-target
# never gets that. (Image *building* still needs normal internet access
# to pull the Python base image and pip packages -- that happens once, at
# `docker compose build` time, before either runtime network exists, the
# same way the root docker-compose.yml's own images are pulled.)

networks:
  test-environment:
    driver: bridge
    internal: true
  edge:
    driver: bridge

services:
  mock-target:
    build:
      context: ./mock-target
    environment:
      ENABLE_BOTD: ${ENABLE_BOTD:-true}
      ENABLE_HONEYPOTS: ${ENABLE_HONEYPOTS:-true}
      ENABLE_DECOY_DATA: ${ENABLE_DECOY_DATA:-true}
      ENABLE_MARKUP_RANDOMIZER: ${ENABLE_MARKUP_RANDOMIZER:-true}
      # docs/OBSTACLE_MAP_AND_ESCALATION_SCHEDULE.md's cookie-consent-wall
      # round: real content genuinely absent until a consent cookie is
      # present (structural/cookie_wall.py) -- on by default like every
      # other layer here.
      ENABLE_COOKIE_WALL: ${ENABLE_COOKIE_WALL:-true}
      # docs/OBSTACLE_MAP_AND_ESCALATION_SCHEDULE.md's A/B-variant round:
      # the post container tag varies between requests
      # (structural/ab_variant.py) -- on by default like every other layer.
      ENABLE_AB_VARIANTS: ${ENABLE_AB_VARIANTS:-true}
      # docs/OBSTACLE_MAP_AND_ESCALATION_SCHEDULE.md's placeholder-content
      # round: real post text arrives via a client-side JS swap after this
      # delay -- comfortably under every antibot provider's own
      # post_load_wait_ms (default 5000ms, docs/REQUIREMENTS.md section 9).
      ENABLE_PLACEHOLDER_CONTENT: ${ENABLE_PLACEHOLDER_CONTENT:-true}
      PLACEHOLDER_DELAY_MS: ${PLACEHOLDER_DELAY_MS:-500}
      # docs/OBSTACLE_MAP_AND_ESCALATION_SCHEDULE.md's Shadow DOM round:
      # every other post renders inside a real, client-side-attached
      # shadow root, invisible to a plain-string HTML parser
      # (structural/shadow_dom.py) -- on by default like every other layer.
      ENABLE_SHADOW_DOM: ${ENABLE_SHADOW_DOM:-true}
      # docs/OBSTACLE_MAP_AND_ESCALATION_SCHEDULE.md's DOM Virtualization
      # round: /feed keeps only a bounded window of posts genuinely
      # present in the DOM at once, evicting the oldest as new ones load
      # (structural/dom_virtualization.py) -- on by default like every
      # other layer.
      ENABLE_DOM_VIRTUALIZATION: ${ENABLE_DOM_VIRTUALIZATION:-true}
      DOM_VIRTUALIZATION_WINDOW_SIZE: ${DOM_VIRTUALIZATION_WINDOW_SIZE:-5}
      MARKUP_RANDOMIZER_INTERVAL_MINUTES: ${MARKUP_RANDOMIZER_INTERVAL_MINUTES:-15}
      FEED_RATE_LIMIT_THRESHOLD: ${FEED_RATE_LIMIT_THRESHOLD:-20}
      FEED_RATE_LIMIT_WINDOW_SECONDS: ${FEED_RATE_LIMIT_WINDOW_SECONDS:-60}
      FEED_PAGE_SIZE: ${FEED_PAGE_SIZE:-10}
      # docs/REQUIREMENTS.md section 9 entry 15 (Known Limitation #1:
      # login/session): real server-side session TTL
      # (security/auth.py's SessionStore) and /feed-protected's own
      # page size/total-pages.
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-300}
      PROTECTED_FEED_PAGE_SIZE: ${PROTECTED_FEED_PAGE_SIZE:-5}
      PROTECTED_FEED_TOTAL_PAGES: ${PROTECTED_FEED_TOTAL_PAGES:-2}
      # docs/OBSTACLE_MAP_AND_ESCALATION_SCHEDULE.md's Interstitials round
      # (محور 6): /feed-interstitial's full-screen overlay -- see
      # structural/interstitial.py.
      INTERSTITIAL_TRIGGER: ${INTERSTITIAL_TRIGGER:-time}
      INTERSTITIAL_DELAY_MS: ${INTERSTITIAL_DELAY_MS:-1000}
      INTERSTITIAL_SCROLL_PERCENT: ${INTERSTITIAL_SCROLL_PERCENT:-30}
      INTERSTITIAL_FEED_PAGE_SIZE: ${INTERSTITIAL_FEED_PAGE_SIZE:-5}
      INTERSTITIAL_FEED_TOTAL_BATCHES: ${INTERSTITIAL_FEED_TOTAL_BATCHES:-3}
      HONEYPOT_LOG_PATH: /logs/honeypot_triggers.log
      BOTD_LOG_PATH: /logs/botd_flags.log
    volumes:
      - ./logs:/logs
    networks:
      - test-environment
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Proof-of-work challenge + default bot-detection policy in front of
  # mock-target -- see README.md section 1.2. Disable entirely by not
  # publishing its port and pointing a spider straight at mock-target
  # instead (there is no ENABLE_ANUBIS toggle: Anubis is a separate
  # container you either include or don't, unlike the in-app layers).
  anubis:
    image: ghcr.io/techarohq/anubis:latest
    environment:
      BIND: ":8080"
      DIFFICULTY: "4"
      TARGET: "http://mock-target:8000"
      POLICY_FNAME: "/data/cfg/botPolicy.yaml"
      SERVE_ROBOTS_TXT: "false"
      # Without this, Anubis 500s on every request ("[misconfiguration]
      # X-Real-Ip header is not set") -- confirmed by hand. It expects a
      # real reverse proxy in front of it to set that header; there isn't
      # one here, so it must read the actual TCP peer address instead.
      USE_REMOTE_ADDRESS: "true"
      # docs/REQUIREMENTS.md section 9 entry 2's real fix, verified
      # against Anubis's own source (cmd/anubis/main.go): `cookie-secure`
      # (env COOKIE_SECURE) is a first-class, documented flag -- Secure
      # defaults to true, which no real browser will persist over this
      # stack's plain http://, so the challenge-passed cookie was never
      # kept. This is the officially supported way to run Anubis without
      # TLS, not a workaround: setting it also auto-downgrades
      # `cookie-same-site` from its default None to Lax (Anubis's own
      # documented behavior for a non-secure deployment), which a real
      # browser would otherwise reject entirely for a non-Secure cookie.
      # Deliberately not real TLS: Anubis has no built-in HTTPS server at
      # all (confirmed against its own source -- it's designed to sit
      # behind a TLS-terminating proxy, which would be a whole additional
      # container plus getting Byparr's Chromium to trust a self-signed
      # CA, an unverified extra failure surface for no real benefit here).
      COOKIE_SECURE: "false"
      # COOKIE_SECURE alone was NOT enough -- confirmed for real (round 3,
      # docs/REQUIREMENTS.md section 9 entry 4): Anubis's own log kept
      # showing "user has cookies disabled, this is not an anubis bug" on
      # every pass-challenge attempt even with Secure off, because this
      # flag was missing here (it was tested by hand alongside
      # COOKIE_SECURE back in round 2 but never actually committed to
      # this file -- an oversight, not a deliberate choice). Anubis's
      # cookies default to CHIPS-Partitioned; not every automated browser
      # context (confirmed: Camoufox's Firefox-based one) handles a
      # Partitioned cookie the same way a normal profile does.
      COOKIE_PARTITIONED: "false"
    depends_on:
      mock-target:
        condition: service_healthy
    ports:
      - "${ANUBIS_PORT:-8080}:8080"
      # Published here, not on the byparr service below, because byparr
      # shares this container's network namespace (network_mode:
      # service:anubis) -- see byparr's own comment for why.
      - "${MOCK_TARGET_BYPARR_PORT:-8193}:8191"
    volumes:
      - "./anubis/botPolicy.yaml:/data/cfg/botPolicy.yaml:ro"
    networks:
      - test-environment
      - edge
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # docs/REQUIREMENTS.md section 9 entry 1's real fix. The root
  # docker-compose.yml's byparr runs as a GitHub Actions `services:`
  # container, on a *different* Docker network than this compose
  # project's -- confirmed for real in CI (run 32479883962): from inside
  # that container, `localhost` means the container itself, not this
  # stack, so it could never reach Anubis at all
  # (NS_ERROR_CONNECTION_REFUSED). `network_mode: "service:anubis"`
  # makes this instance share Anubis's network namespace outright --
  # its own `localhost:8080` *is* Anubis's own listener, no DNS or
  # extra_hosts trick needed, and the exact same URL
  # (http://localhost:8080/) already in mock_target.yaml keeps working
  # unchanged for the plain-Scrapy-fallback case too. `ports:` can't be
  # declared here since this service doesn't own its network namespace
  # -- see Anubis's own `ports:` above instead.
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    network_mode: "service:anubis"
    depends_on:
      anubis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
