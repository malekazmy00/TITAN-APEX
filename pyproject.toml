[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-apex"
version = "0.1.0"
description = "OSINT / scraping platform core (Phase 1: foundations)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "TITAN-APEX" }]

dependencies = [
    "scrapy>=2.11,<3.0",
    # Upper bound narrowed from <2.0 to <1.56 -- a real, locally-confirmed
    # (not assumed) incompatibility between playwright's Python package
    # and the currently-installed Camoufox 0.4.11 browser build
    # (v152.0.4-beta.29): `playwright==1.62.0` (the newest release
    # satisfying the old `<2.0` bound as of this pin) fails every single
    # Camoufox browser launch with
    # `Browser.setDefaultViewport ... Found property "<root>.viewport.isMobile"
    # - false which is not described in this scheme` -- a genuine Juggler
    # protocol-schema mismatch between playwright-core's newer viewport
    # payload and what this Camoufox build's bundled Firefox understands,
    # not a project bug. `playwright==1.55.0` was confirmed by hand to
    # launch Camoufox successfully and reproduce the real, previously
    # CI-confirmed DOM Virtualization progressive-extraction race
    # (docs/REQUIREMENTS.md section 9 entry 17) exactly as documented.
    # Since this project's own dependency install (`pip install -e
    # ".[dev,testenv]"`, unpinned lockfile) resolves whatever the newest
    # matching release is at install time, an unpinned upper bound risked
    # every future CI run hard-crashing every Camoufox-driven test on
    # browser launch alone, unrelated to and masking the real race this
    # entry is investigating. Revisit this upper bound once Camoufox (or
    # its own upstream Firefox build) actually supports the newer
    # protocol shape -- not before, and not by just widening the range
    # without re-confirming a real launch succeeds.
    "playwright>=1.44,<1.56",
    # docs/REQUIREMENTS.md section 9 entry 14: src/providers/antibot/
    # _parsed_html.py imports this directly (parsel.Selector) to parse
    # multiple html snapshots captured during progressive scroll
    # collection -- was already a transitive dependency of scrapy, made
    # explicit since it's now imported directly, not just through
    # response.css().
    "parsel>=1.8,<2.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "redis>=5.0,<6.0",
    "rq>=1.16,<2.0",
    # Second AntibotProvider implementation (docs/REQUIREMENTS.md section 9
    # entry 4 / round 3), selected per-target via SpiderConfig's
    # antibot_provider field -- a real product dependency, not test infra,
    # the same way playwright already is for render_js.
    "camoufox>=0.4,<1.0",
    # Third AntibotProvider implementation (this phase's revision): a
    # lighter-weight, Chromium-only stealth option on top of the Playwright
    # this project already depends on -- confirmed against its own real
    # PyPI metadata (current release 1.62.1) before pinning.
    "patchright>=1.60,<2.0",
    # docs/REQUIREMENTS.md section 9 entry 20 (item 10's mouse-simulation
    # phase, temporary baseline): generates human-like curved cursor
    # paths (see src/providers/antibot/_mouse_movement.py's own module
    # docstring for the full library comparison against
    # DaiCapra/Natural-Mouse-Movements-Neural-Networks, rejected for its
    # heavier Keras/TensorFlow + model-weight-file footprint). Pinned to
    # the exact release this project tested by hand (1.1.0, PyPI) --
    # oxymouse ships no changelog/semver guarantee this project has
    # independently verified, so widening this range later needs the
    # same real, hands-on re-testing this pin itself was based on (this
    # module's own docstring has the exact recorded output that
    # justified choosing its "bezier" algorithm over "gaussian"/"perlin").
    "oxymouse==1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "types-PyYAML>=6.0,<7.0",
]
# Only for developing/testing test-environment/mock-target -- kept out of
# the main `dependencies` list so the product itself never depends on
# Flask/Faker (docs/REQUIREMENTS.md section 8: test infrastructure, not
# a dependency of what it tests).
testenv = [
    "flask>=3.0,<4.0",
    "faker>=25.0,<26.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
# Matches the actual CI runner (.github/workflows/ci.yml,
# actions/setup-python@v5, python-version: "3.12") -- not just cosmetic:
# numpy (a transitive dependency of camoufox, docs/REQUIREMENTS.md
# section 9 entry 4 / round 3) ships stub files using 3.12-only syntax
# (PEP 695 `type` statements), which mypy can't even parse under a 3.11
# target. requires-python still allows >=3.11 for runtime compatibility;
# this only changes which language version mypy's own type-checking
# assumes.
python_version = "3.12"
strict = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["scrapy.*", "twisted.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# docs/REQUIREMENTS.md section 9 entry 20: unlike camoufox/patchright
# (both ship a real py.typed marker, confirmed by hand), oxymouse ships
# neither a py.typed marker nor separate stub files -- confirmed the
# same way (no py.typed anywhere under its installed package dir).
module = ["oxymouse.*"]
ignore_missing_imports = true
