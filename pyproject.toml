[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-apex"
version = "0.1.0"
description = "OSINT / scraping platform core (Phase 1: foundations)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "TITAN-APEX" }]

dependencies = [
    "scrapy>=2.11,<3.0",
    "playwright>=1.44,<2.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "redis>=5.0,<6.0",
    "rq>=1.16,<2.0",
    # Second AntibotProvider implementation (docs/REQUIREMENTS.md section 9
    # entry 4 / round 3), selected per-target via SpiderConfig's
    # antibot_provider field -- a real product dependency, not test infra,
    # the same way playwright already is for render_js.
    "camoufox>=0.4,<1.0",
    # Third AntibotProvider implementation (this phase's revision): a
    # lighter-weight, Chromium-only stealth option on top of the Playwright
    # this project already depends on -- confirmed against its own real
    # PyPI metadata (current release 1.62.1) before pinning.
    "patchright>=1.60,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "types-PyYAML>=6.0,<7.0",
]
# Only for developing/testing test-environment/mock-target -- kept out of
# the main `dependencies` list so the product itself never depends on
# Flask/Faker (docs/REQUIREMENTS.md section 8: test infrastructure, not
# a dependency of what it tests).
testenv = [
    "flask>=3.0,<4.0",
    "faker>=25.0,<26.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
# Matches the actual CI runner (.github/workflows/ci.yml,
# actions/setup-python@v5, python-version: "3.12") -- not just cosmetic:
# numpy (a transitive dependency of camoufox, docs/REQUIREMENTS.md
# section 9 entry 4 / round 3) ships stub files using 3.12-only syntax
# (PEP 695 `type` statements), which mypy can't even parse under a 3.11
# target. requires-python still allows >=3.11 for runtime compatibility;
# this only changes which language version mypy's own type-checking
# assumes.
python_version = "3.12"
strict = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["scrapy.*", "twisted.*"]
ignore_missing_imports = true
